appId: dev.addiator.visualizer
productName: Visualizer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!**/.claude/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{vite.panel.config.mts,vitest.config.mts}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,CLAUDE.md,Visualizer_plan.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.panel.json}'
asarUnpack:
  - resources/**
win:
  executableName: visualizer
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: Visualizer analizuje dźwięk, żeby sterować efektami.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  executableName: visualizer
  maintainer: Shaggy
  category: AudioVideo
  syncDesktopName: true
  synopsis: Wideo z filtrami sterowanymi dźwiękiem z systemu
appImage:
  artifactName: Visualizer-${version}.${ext}
deb:
  artifactName: visualizer_${version}_${arch}.${ext}
npmRebuild: false
